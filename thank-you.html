<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Speedrun AI Labs</title>
    <link rel="canonical" href="https://www.speedrunlab.ai/thank-you.html">
    <style>
        /* Instrument Serif — self-hosted (SIL OFL 1.1, see /fonts/OFL.txt) */
        @font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
        @font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
        @font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-italic-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
        @font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-italic-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{color-scheme:light;--white:#FBFBFB;--black:#1D1D1F;--grey-light:#E5E5E7;--grey-nav:#86868B;--grey-mid:#6E6E73;--grey-dark:#424245;--font-sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;--font-serif:'Instrument Serif',Georgia,'Times New Roman',serif}
        html{scroll-behavior:smooth}
        body{font-family:var(--font-sans);background:var(--white);color:var(--black);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;display:flex;flex-direction:column;min-height:100vh}
        nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(251,251,251,0.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,0.06)}
        .nav-inner{max-width:980px;margin:0 auto;padding:0 22px;height:80px;display:flex;align-items:center;justify-content:center}
        .nav-top-row{display:contents}
        .nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--black)}
        .nav-logo img{height:106px;width:auto}
        .nav-logo .logo-dark{display:block}
        .nav-linkedin{display:flex;align-items:center;color:var(--grey-nav);transition:color 0.2s ease;flex-shrink:0;margin-left:4px}
        .nav-linkedin:hover{color:#0A66C2}
        .nav-logo .logo-light{display:none}
        @media(prefers-color-scheme:dark){.nav-logo .logo-dark{display:none}.nav-logo .logo-light{display:block}}
        .content{flex:1;display:flex;align-items:center;justify-content:center;padding:120px 22px 80px;text-align:center}
        .thank-you h1{font-family:var(--font-serif);font-size:clamp(32px,5vw,48px);font-weight:400;font-style:italic;color:var(--black);margin-bottom:16px}
        .thank-you p{font-family:var(--font-sans);font-size:clamp(16px,2vw,18px);color:var(--grey-dark);line-height:1.6;margin-bottom:40px;max-width:480px;margin-left:auto;margin-right:auto}
        .back-btn{display:inline-block;font-family:var(--font-sans);font-size:15px;font-weight:500;color:var(--white);background:var(--black);text-decoration:none;border-radius:980px;padding:14px 40px;transition:opacity 0.2s}
        .back-btn:hover{opacity:0.82}
        .footer{border-top:1px solid var(--grey-light);padding:20px 22px;text-align:center}
        .footer p{font-family:var(--font-sans);font-size:12px;color:var(--grey-mid)}
        .footer a{color:var(--grey-mid);text-decoration:none}
        .footer a:hover{color:var(--black)}
        @media(max-width:768px){
            .nav-inner{height:auto;flex-direction:column;align-items:stretch;padding:0;gap:0}
            .nav-top-row{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:64px}
            .nav-logo img{height:65px}
            .nav-linkedin{margin-left:0}
            body{padding-top:128px}
        }
    </style>
</head>
<body>
    <script src="/nav.js"></script>
    <div class="content">
        <div class="thank-you">
            <h1>Thank you.</h1>
            <p>Your message has been received. We will get back to you soon.</p>
            <a href="https://speedrunlab.ai" class="back-btn">Back to Home</a>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2026 Speedrun AI Labs. Sydney, Australia. <a href="https://www.speedrunlab.ai">speedrunlab.ai</a></p>
    </footer>
</body>
</html>
